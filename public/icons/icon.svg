<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Instagram-like gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f09433" />
      <stop offset="25%" stop-color="#e6683c" />
      <stop offset="50%" stop-color="#dc2743" />
      <stop offset="75%" stop-color="#cc2366" />
      <stop offset="100%" stop-color="#bc1888" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#bc1888" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />
  
  <!-- Outer glowing calendar container -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Calendar body background -->
    <rect width="320" height="320" rx="48" fill="#ffffff" />
    
    <!-- Calendar top bar (Header) -->
    <path d="M 0 48 Q 0 0 48 0 L 272 0 Q 320 0 320 48 L 320 96 L 0 96 Z" fill="#dc2743" />
    
    <!-- Calendar rings (binders) -->
    <rect x="64" y="-24" width="24" height="48" rx="12" fill="#bc1888" />
    <rect x="232" y="-24" width="24" height="48" rx="12" fill="#bc1888" />
    
    <!-- Instagram camera lens inside the calendar page -->
    <!-- Outer ring of camera lens -->
    <rect x="96" y="144" width="128" height="128" rx="36" fill="none" stroke="url(#brand-grad)" stroke-width="18" />
    <!-- Center circle of camera lens -->
    <circle cx="160" cy="208" r="32" fill="url(#brand-grad)" />
    <!-- Flash dot -->
    <circle cx="200" cy="168" r="8" fill="#e6683c" />
  </g>
</svg>
